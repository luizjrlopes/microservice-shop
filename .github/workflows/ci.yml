name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/workers/scheduler-agent/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/bdd/package-lock.json
      - name: Install Python dependencies
        run: pip install -r services/workers/scheduler-agent/requirements-dev.txt
      - name: Install BDD dependencies
        run: npm ci --prefix tests/bdd
      - name: Run quality gates
        run: make lint

  unit-tests:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/workers/scheduler-agent/requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r services/workers/scheduler-agent/requirements-dev.txt
      - name: Run unit and integration tests
        run: make test

  security:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/bdd/package-lock.json
      - name: Install security tooling
        run: pip install -r services/workers/scheduler-agent/requirements-dev.txt
      - name: Install BDD dependencies
        run: npm ci --prefix tests/bdd
      - name: Run security checks
        run: make security

  integration-e2e:
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/bdd/package-lock.json
      - name: Install BDD dependencies
        run: npm ci --prefix tests/bdd
      - name: Build and start distributed stack
        run: docker compose up -d --build
      - name: Wait for order-service health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run distributed BDD suite
        env:
          ORDER_URL: http://localhost:8080
          RABBIT_URL: amqp://microservice_shop:microservice_shop@localhost:5672
        run: npm test --prefix tests/bdd
      - name: Capture container state
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-ps.txt
          docker compose logs --no-color > artifacts/compose.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-diagnostics
          path: artifacts/
      - name: Stop stack
        if: always()
        run: docker compose down -v
