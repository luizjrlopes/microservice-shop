name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/workers/scheduler-agent/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/bdd/package-lock.json
      - name: Install Python dependencies
        run: pip install -r services/workers/scheduler-agent/requirements-dev.txt
      - name: Install BDD dependencies
        working-directory: tests/bdd
        run: npm ci
      - name: Run linters
        run: make lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/workers/scheduler-agent/requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r services/workers/scheduler-agent/requirements-dev.txt
      - name: Run unit tests
        run: make test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/workers/scheduler-agent/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/bdd/package-lock.json
      - name: Install Python dependencies
        run: pip install -r services/workers/scheduler-agent/requirements-dev.txt
      - name: Install BDD dependencies
        working-directory: tests/bdd
        run: npm ci
      - name: Run security checks
        run: make security

  integration-bdd:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/bdd/package-lock.json
      - name: Install BDD dependencies
        working-directory: tests/bdd
        run: npm ci
      - name: Build and start the distributed stack
        run: |
          set -o pipefail
          docker compose up -d --build 2>&1 | tee compose-up.log
      - name: Wait for order service readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "order-service did not become healthy in time"
          exit 1
      - name: Run end-to-end BDD scenarios
        working-directory: tests/bdd
        run: npm test
      - name: Capture distributed stack diagnostics
        if: always()
        run: |
          docker compose ps --all > compose-ps.log 2>&1 || true
          docker compose logs --no-color > compose-services.log 2>&1 || true
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-bdd-diagnostics
          path: |
            compose-up.log
            compose-ps.log
            compose-services.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Print distributed stack logs
        if: always()
        run: cat compose-services.log || true
      - name: Stop distributed stack
        if: always()
        run: docker compose down -v
