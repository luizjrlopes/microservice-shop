name: Finalize formatting

on:
  push:
    branches:
      - agent/microservice-shop-transactional-outbox

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/microservice-shop-transactional-outbox
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install black==24.4.2
      - run: black services/workers/scheduler-agent
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/workers/scheduler-agent
          git commit -m "style: format scheduler agent"
          git push origin HEAD:agent/microservice-shop-transactional-outbox
