name: Finalize npm audit

on:
  push:
    branches:
      - agent/microservice-shop-transactional-outbox

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/microservice-shop-transactional-outbox
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade vulnerable BDD dependencies
        working-directory: tests/bdd
        run: |
          npm ci
          npm audit fix --force
          npm audit --audit-level=high
          npm run lint
      - name: Commit dependency remediation
        run: |
          if git diff --quiet -- tests/bdd/package.json tests/bdd/package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/bdd/package.json tests/bdd/package-lock.json
          git commit -m "chore: remediate BDD dependency vulnerabilities"
          git push origin HEAD:agent/microservice-shop-transactional-outbox
