server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/microservice_shop}
spring.datasource.username=${DB_USER:microservice_shop}
spring.datasource.password=${DB_PASSWORD:microservice_shop}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated

messaging.orders.exchange=${ORDERS_EXCHANGE:orders.events}
messaging.orders.created-routing-key=${ORDER_CREATED_ROUTING_KEY:order.created.v1}

outbox.publisher.initial-delay-ms=${OUTBOX_PUBLISHER_INITIAL_DELAY_MS:1000}
outbox.publisher.fixed-delay-ms=${OUTBOX_PUBLISHER_DELAY_MS:1000}
outbox.publisher.batch-size=${OUTBOX_PUBLISHER_BATCH_SIZE:50}
outbox.publisher.confirm-timeout-ms=${OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=order-service
