services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop-local
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  order-service:
    build: ./services/api/order-service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: shop
      RABBITMQ_PASSWORD: shop-local
      ORDER_RETRY_DELAY_MS: "5000"
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  scheduler-agent:
    build: ./services/workers/scheduler-agent
    environment:
      RABBIT_URL: amqp://shop:shop-local@rabbitmq:5672
      ORDER_URL: http://order-service:8080
      REQUEST_TIMEOUT_SECONDS: "5"
      MAX_RETRIES: "3"
      RETRY_DELAY_MS: "5000"
      LOG_LEVEL: INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped
